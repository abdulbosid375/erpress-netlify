
<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home Page</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 10%;
      background: #1f2937;
    }

    nav h2 {
      color: #3b82f6;
    }

    nav a {
      color: white;
      text-decoration: none;
    }

    .container {
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .content h1 {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .content p {
      color: #9ca3af;
      font-size: 18px;
      margin-bottom: 25px;
    }

    .content a {
      display: inline-block;
      padding: 13px 30px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    .content a:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>

  <nav>
    <h2>MyWebsite</h2>
    <a href="index.html">Logout</a>
  </nav>

  <div class="container">
    <div class="content">
      <h1>Welcome to Home Page!</h1>
      <p>Saytimizga xush kelibsiz.</p>
      <a href="index.html">Back</a>
    </div>
  </div>

</body>
</html>
