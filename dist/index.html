<form onsubmit="login(event)">
  <input id="name" placeholder="Ism">
  <input id="password" type="password" placeholder="Parol">
  <button>Enter</button>
</form>

<script>
  function login(e) {
    e.preventDefault();

    if (name.value == "admin" && password.value == "admin") {
      location.href = "home.html";
    } else {
      alert("Sorry");
    }
  }
</script>
